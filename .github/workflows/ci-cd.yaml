name: build-test-deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: helpdesk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon spotlessCheck build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage
          path: |
            build/reports/
            build/test-results/
          retention-days: 30
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
  deploy:
    needs: publish
    runs-on: [self-hosted, linux, x64, helpdesk-kali]
    environment: training
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          STAND_DIR: ${{ vars.STAND_DIR }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          test -n "$STAND_DIR"
          test -n "$DB_PASSWORD"
          mkdir -p "$STAND_DIR/scripts"
          cp compose.yaml "$STAND_DIR/compose.yaml"
          cp scripts/deploy.sh scripts/rollback.sh scripts/smoke.py scripts/backup.sh scripts/restore.sh "$STAND_DIR/scripts/"
          cd "$STAND_DIR"
          if [ ! -f .env ]; then
            umask 077
            printf 'DB_NAME=helpdesk
DB_USER=helpdesk
APP_PORT=8080
APP_BIND=127.0.0.1
DB_PASSWORD=%s
' "$DB_PASSWORD" > .env
          fi
          bash scripts/deploy.sh "$IMAGE"
          docker compose ps
          curl --fail --retry 5 --retry-delay 3 http://127.0.0.1:8080/actuator/health/readiness
      - if: always()
        env:
          STAND_DIR: ${{ vars.STAND_DIR }}
        run: |
          if [ -n "$STAND_DIR" ] && [ -f "$STAND_DIR/.env" ]; then
            cd "$STAND_DIR"
            mkdir -p "$GITHUB_WORKSPACE/deployment-evidence"
            docker compose ps > "$GITHUB_WORKSPACE/deployment-evidence/containers.txt"
            docker compose logs --no-color --tail=150 app > "$GITHUB_WORKSPACE/deployment-evidence/application.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence
          path: deployment-evidence/
